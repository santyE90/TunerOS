[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tuneros"
version = "0.1.0"
description = "Python CAN decode, raw sessions, telemetry, and API for TunerOS simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "canmatrix>=1.2,<2",
  "fastapi>=0.141,<1",
  "uvicorn>=0.52,<1",
  "websockets>=17,<18",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = { "" = "backend/src" }

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
"tuneros.can" = ["dbc/*.dbc"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
